services:
    web:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_URL: ${APP_URL:-http://localhost}
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - storage:/var/www/html/storage/app/public
        expose:
            - '80'
        environment:
            RUN_MIGRATIONS: 'true'
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD', '/usr/local/bin/healthcheck']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 45s

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-portolio}
            POSTGRES_USER: ${DB_USERNAME:-portolio}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-portolio} -d ${DB_DATABASE:-portolio}',
                ]
            interval: 5s
            timeout: 5s
            retries: 12

volumes:
    storage:
    postgres-data:
